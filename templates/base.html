<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Real Estate Analyzer - Kobi Score{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <svg width="32" height="32" viewBox="0 0 64 64" style="display: inline-block; vertical-align: middle;">
          <ellipse cx="32" cy="36" rx="18" ry="16" fill="#8b5cf6"/>
          <path d="M 18 24 L 14 12 L 24 20 Z" fill="#8b5cf6"/>
          <path d="M 46 24 L 50 12 L 40 20 Z" fill="#8b5cf6"/>
          <path d="M 24 32 Q 26 34 28 32" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M 36 32 Q 38 34 40 32" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M 24 40 Q 32 46 40 40" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="32" cy="38" rx="2" ry="1.5" fill="#fff"/>
        </svg>
        Real Estate Analyzer
      </a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
      </ul>
    </div>
  </nav>

  <main class="container mt-4 fade-in">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">&times;</button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
