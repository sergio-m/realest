{% extends "base.html" %}
{% block content %}
<div class="text-center">
  <h2>Search Properties by Zip Code</h2>
  <form method="POST" action="{{ url_for('search_properties') }}" class="mt-3">
    <div class="input-group w-50 mx-auto">
      <input type="text" class="form-control" name="zip_code" placeholder="Enter 5-digit Zip Code" required>
      <button type="submit" class="btn btn-primary">Search</button>
    </div>
    <div class="form-check mt-2">
      <input class="form-check-input" type="checkbox" name="force_refresh" id="force_refresh">
      <label class="form-check-label" for="force_refresh">
        Force fresh data (ignore today's cache)
      </label>
    </div>
  </form>
</div>
{% endblock %}
