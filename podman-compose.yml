version: "3.8"

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: realestate_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    ports:
      - "5433:5432"
    networks:
      - realestate_network

  web:
    build: .
    container_name: realestate_web
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${FLASK_DEBUG}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      ZILLOW_API_KEY: ${ZILLOW_API_KEY}
      ZILLOW_API_HOST: ${ZILLOW_API_HOST}
    ports:
      - "5005:5005"
    depends_on:
      - postgres
    networks:
      - realestate_network
    volumes:
      - ./logs:/app/logs:Z

volumes:
  postgres_data:

networks:
  realestate_network:
    driver: bridge